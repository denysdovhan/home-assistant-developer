name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false

      - name: Install Claude plugin validator
        run: npm install --global @anthropic-ai/claude-code@2.1.150 --registry=https://registry.npmjs.org

      - name: Check formatting, skills, and plugin manifests
        run: make check

      - name: Verify checks left files unchanged
        run: git diff --exit-code
