name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize release automation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft_release:
    name: Draft Release
    permissions:
      contents: write
      pull-requests: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Update release notes from merged pull requests
        uses: release-drafter/release-drafter@v7.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          publish: false
