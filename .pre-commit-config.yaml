repos:
  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.58.0
    hooks:
      - id: oxfmt
        args: [--no-error-on-unmatched-pattern]
        types_or: [text]

  - repo: local
    hooks:
      - id: validate-skills
        name: Validate skills
        entry: ./scripts/validate-skills.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-plugin
        name: Validate plugin
        entry: ./scripts/validate-plugin.sh
        language: system
        pass_filenames: false
        always_run: true
